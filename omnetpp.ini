
[Caso1]
network = Network
sim-time-limit = 200s

Network.node[0].app.interArrivalTime = exponential(1)
Network.node[0].app.packetByteSize = 125000
Network.node[0].app.destination = 5

Network.node[2].app.interArrivalTime = exponential(1)
Network.node[2].app.packetByteSize = 125000
Network.node[2].app.destination = 5


[Caso2]
network = Network
sim-time-limit = 200s

Network.node[{0,1,2,3,4,6,7}].app.interArrivalTime = exponential(1)
Network.node[{0,1,2,3,4,6,7}].app.packetByteSize = 125000
Network.node[{0,1,2,3,4,6,7}].app.destination = 5


# --- Mismos escenarios que arriba, pero enrutando con el algoritmo propuesto
# (tabla de rutas mas cortas aprendida via HELLOs, ver Net.cc). Se reusan
# exactamente el mismo trafico, canales y semilla: la unica diferencia es
# Network.node[*].net.useShortestPath, para que la comparacion sea justa.

[Caso1Propuesto]
extends = Caso1
description = "Caso 1 enrutando con el algoritmo propuesto (ruta mas corta via HELLO)"
Network.node[*].net.useShortestPath = true

[Caso2Propuesto]
extends = Caso2
description = "Caso 2 enrutando con el algoritmo propuesto (ruta mas corta via HELLO)"
Network.node[*].net.useShortestPath = true


# --- Barrido de interArrivalTime sobre el escenario del Caso 2, para estimar
# el umbral de estabilidad de cada algoritmo (vease Sec. "Tarea de Analisis").

[Caso2Sweep]
extends = Caso2
sim-time-limit = 200s
Network.node[{0,1,2,3,4,6,7}].app.interArrivalTime = exponential(${iat = 2, 3, 4, 5, 6, 7, 8, 10, 15, 20})
description = "Caso 2 (kickstarter): demora/buffers vs. interArrivalTime"

[Caso2SweepPropuesto]
extends = Caso2Sweep
Network.node[*].net.useShortestPath = true
description = "Caso 2 (propuesto): demora/buffers vs. interArrivalTime"
